{% extends "base.html" %}

{% block title %}Server Error (500) — ProjectGuard{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card card-modern p-5 max-w-lg mx-auto border-0 shadow-sm" style="max-width: 550px;">
        <div class="text-warning display-1 mb-3"><i class="fas fa-exclamation-circle"></i></div>
        <h3 class="fw-bold">500 — Internal Server Error</h3>
        <p class="text-muted small mb-4">
            An unexpected error occurred while processing your request. Our technical team has been notified.
        </p>
        <div>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
                <i class="fas fa-home me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
