{% extends "base.html" %}

{% block title %}Page Not Found (404) — ProjectGuard{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card card-modern p-5 max-w-lg mx-auto border-0 shadow-sm" style="max-width: 550px;">
        <div class="text-primary display-1 mb-3"><i class="fas fa-compass"></i></div>
        <h3 class="fw-bold">404 — Page Not Found</h3>
        <p class="text-muted small mb-4">
            The project, milestone report, or page you were looking for could not be found or has been moved.
        </p>
        <div>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
                <i class="fas fa-home me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
